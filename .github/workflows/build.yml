name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls "$ANDROID_SDK_ROOT" || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/botforge.p12
            echo "keystore ready"
          else
            echo "no keystore secret, release 将不签名"
          fi

      - name: Write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf 'storeFile=keystore/botforge.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "keystore.properties written"
          fi

      - name: Build debug
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Build release
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee release.log || echo "release 失败，仅产出 debug"

      - name: Report build log to paste
        if: always()
        run: |
          if [ -f build.log ]; then
            URL=$(tail -n 200 build.log | curl -sS --max-time 30 --data-binary @- https://paste.rs/ || echo FAILED)
            echo "BUILD_LOG_URL=$URL" >> $GITHUB_STEP_SUMMARY
            echo "BUILD_LOG_URL=$URL"
            echo "$URL" > /tmp/paste_url.txt
            # 把错误行切成多条 annotation，便于用 API 读取
            grep -E "^(e:|w: .*error|FAILURE:|> Task .* FAILED|Execution failed|Caused by|\* What went wrong|A problem occurred)" build.log \
              | head -30 | while IFS= read -r line; do
                echo "::error title=gradle::$(printf '%s' "$line" | head -c 900)"
              done
            # 额外：把最后 40 行逐行发成 warning annotation
            tail -n 20 build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::notice title=tail::$(printf '%s' "$line" | head -c 900)"
            done
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            release.log
          retention-days: 7

      - name: Collect APKs
        run: |
          mkdir -p out
          if [ -d app/build/outputs/apk ]; then
            find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; || true
          fi
          echo "--- collected ---"
          ls -lh out || true
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "no apk produced, listing build dirs"
            ls -R app/build/outputs 2>/dev/null | head -50 || true
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BotForge-apk
          path: out/*.apk
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk