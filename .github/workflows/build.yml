name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls "$ANDROID_SDK_ROOT" || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup NDK
        run: |
          # libbfpty.so 需要 NDK 里的 clang 与 cmake 工具链。
          # runner 自带 SDK，直接装对应版本的 ndk 与 cmake 即可。
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/botforge.p12
            echo "keystore ready"
          else
            echo "no keystore secret, release 将不签名"
          fi

      - name: Write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf 'storeFile=keystore/botforge.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "keystore.properties written"
          fi

      # 失败时必须给出原因：原实现只 tee 到 test.log 就 exit，
      # 而 test.log 既不上传也不打印，于是「单测挂了」永远查不到是哪一条，
      # 只能靠猜。这段把失败行切成 annotation，直接显示在 run 页面上。
      - name: Unit tests
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::单元测试失败（exit $rc），以下摘录 test.log 关键行"
            grep -E "^(e: |FAILURE:|Execution failed|Caused by|\* What went wrong)|[0-9]+ tests? completed|FAILED$" test.log \
              | head -40 | while IFS= read -r line; do
                echo "::error title=test::$(printf '%s' "$line" | head -c 900)"
              done
            echo "----- test.log 末尾 40 行 -----"
            tail -n 40 test.log
          fi
          exit $rc

      # continue-on-error 曾让编译失败也显示 ✓：
      # 整步永久为真，等于没有信号，问题只能等装包时才发现。
      # 现在 debug 编译失败就是失败——这是装机走的那条路径。
      - name: Build debug
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # release 仍允许失败：未配置签名密钥时 assembleRelease 必然失败，
      # 那种情况下 debug 产物依然可装机。这里用 `|| true` 表达「可选」，
      # 而不是 continue-on-error —— 后者会让步骤本身显示成功。
      - name: Build release
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee release.log || echo "release 失败（可能未配置签名），仅产出 debug"

      - name: Report build log to paste
        if: always()
        run: |
          if [ -f build.log ]; then
            URL=$(tail -n 200 build.log | curl -sS --max-time 30 --data-binary @- https://paste.rs/ || echo FAILED)
            echo "BUILD_LOG_URL=$URL" >> $GITHUB_STEP_SUMMARY
            echo "BUILD_LOG_URL=$URL"
            echo "$URL" > /tmp/paste_url.txt
            # 把错误行切成多条 annotation，便于用 API 读取
            grep -E "^(e:|w: .*error|FAILURE:|> Task .* FAILED|Execution failed|Caused by|\* What went wrong|A problem occurred)" build.log \
              | head -30 | while IFS= read -r line; do
                echo "::error title=gradle::$(printf '%s' "$line" | head -c 900)"
              done
            # 额外：把最后 40 行逐行发成 warning annotation
            tail -n 20 build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::notice title=tail::$(printf '%s' "$line" | head -c 900)"
            done
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            release.log
            test.log
          retention-days: 7

      - name: Collect APKs
        run: |
          mkdir -p out
          if [ -d app/build/outputs/apk ]; then
            find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; || true
          fi
          echo "--- collected ---"
          ls -lh out || true
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "no apk produced, listing build dirs"
            ls -R app/build/outputs 2>/dev/null | head -50 || true
            exit 1
          fi

      - name: Verify APK contents
        run: |
          set -u
          # 优先校验 release：装机走的是它，debug 只作兜底
          APK=$(ls out/*release*.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || APK=$(ls out/*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          test -n "$APK" || { echo "::error::未产出 APK"; exit 1; }

          # 解包后逐项核对运行时依赖是否真的进了包。
          # 这些文件缺失时应用可以启动，但终端页只会显示
          # “缺少运行环境组件”，属于装完才发现的问题，必须前置拦截。
          rm -rf apkx && mkdir -p apkx
          unzip -q "$APK" -d apkx

          fail=0
          check() {
            if [ -e "$2" ]; then
              printf '  ok   %-46s %s\n' "$1" "$(du -h "$2" | cut -f1)"
            else
              printf '  FAIL %-46s 缺失\n' "$1"
              echo "::error title=APK 内容缺失::$1 ($2)"
              fail=1
            fi
          }

          # 注意 libtalloc 的实际文件名是 libtalloc.so：jniLibs 只收 lib*.so，
          # proot 需要的 soname libtalloc.so.2 由应用首次启动时复制生成。
          check "proot 可执行文件"        apkx/lib/arm64-v8a/libbfproot.so
          check "talloc 库"               apkx/lib/arm64-v8a/libtalloc.so
          check "shmem 库"                apkx/lib/arm64-v8a/libandroid-shmem.so
          check "rootfs 数据"             apkx/assets/rootfs/termux-rootfs.tar
          check "classes.dex"             apkx/classes.dex
          check "资源表"                  apkx/resources.arsc

          # 架构必须只有 arm64-v8a：多架构会让包体翻倍且与 proot 二进制不匹配
          abis=$(ls apkx/lib 2>/dev/null | tr '\n' ' ')
          echo "  lib 架构: $abis"
          case "$abis" in
            "arm64-v8a ") : ;;
            *) echo "::error title=架构不符::期望仅 arm64-v8a，实际 [$abis]"; fail=1 ;;
          esac

          # rootfs 必须是有效 gzip，避免空文件或截断文件混入
          if [ -e apkx/assets/rootfs/termux-rootfs.tar ]; then
            gzip -t apkx/assets/rootfs/termux-rootfs.tar \
              && echo "  ok   rootfs gzip 完整性" \
              || { echo "::error title=rootfs 损坏::gzip 校验失败"; fail=1; }
          fi

          # 版本号与包名核对，防止改漏 build.gradle
          PKG=$(grep -o 'package="[^"]*"' apkx/AndroidManifest.xml 2>/dev/null | head -1)
          echo "  manifest: ${PKG:-未解析到 package}"

          echo "----------------------------------------"
          if [ "$fail" -ne 0 ]; then
            echo "::error::APK 完整性校验未通过"
            exit 1
          fi
          echo "APK 完整性校验通过"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BotForge-apk
          path: out/*.apk
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk