name: 缺陷报告
description: 功能异常、崩溃、行为与预期不符
title: "[缺陷] 简述问题"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量把信息填全。只说「用不了」「打不开」的报告无法定位问题，
        会被要求补充信息。

  - type: input
    id: device
    attributes:
      label: 设备型号
      description: 设置 → 关于手机 → 型号
      placeholder: 例如 Pixel 7
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android 版本
      placeholder: 例如 Android 14
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置页底部可见，形如 1.1.5 (6)
      placeholder: 例如 1.1.5 (6)
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: 设备架构
      description: 与终端相关问题必填。其他问题可跳过
      options:
        - arm64-v8a
        - armeabi-v7a
        - x86_64
        - 不确定
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开应用
        2. 进入终端页
        3. 输入 xxx
        4. 看到 yyy
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有错误信息请把文字贴出来，不要只发截图
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        应用内日志页导出。导出前请删掉含个人信息、API Key、群号的行。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 已确认使用最新版本
          required: true
        - label: 已搜索过现有 Issue，没有重复
          required: true