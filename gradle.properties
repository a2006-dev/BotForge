org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 依赖下载容错：Maven Central / gradlePluginPortal 在 CI 上偶发 429 限流，
# 增加重试次数与退避间隔，避免因网络抖动导致构建失败（与代码无关）。
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=3000
