plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ajx.botforge'
    compileSdk 34

    defaultConfig {
        applicationId "com.ajx.botforge"
        minSdk 26
        targetSdk 34
        versionCode 41
        versionName "1.8.3"

        // 内置 proot 只有 aarch64 版本，其他 ABI 装上也跑不了终端，
        // 直接限定 arm64-v8a，减少包体。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // assets 里的 rootfs 已经是 gzip 压缩体，再压一次既浪费时间也增大体积，
    // 并且会让运行时的流式解包变慢。
    //
    // 注意声明的是 'tar' 而不是 'gz'：源文件名为 alpine-rootfs.tar（内容为
    // gzip 流）。若源文件保留 .gz 后缀，AAPT 会在打包时剥掉该后缀，
    // 产物路径与源码路径不一致，运行时按常量 open 必然失败。
    androidResources {
        noCompress 'tar'
    }

    // jniLibs 里的 proot 以 libbfproot.so 命名，需要随包释放且不被裁剪。
    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libbfproot.so', '**/libtalloc.so*', '**/libandroid-shmem.so',
                              '**/libbfloader.so']
        }
    }

    signingConfigs {
        release {
            def ksProps = new Properties()
            def ksFile = rootProject.file('keystore.properties')
            if (ksFile.exists()) {
                ksProps.load(new FileInputStream(ksFile))
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            // CI 的 debug 包默认用 runner 随机生成的 debug keystore，导致每次构建
            // 签名都不同、永远装不上去。若有 keystore.properties，debug 也统一用
            // 这个固定 keystore 签名，保证可以覆盖安装。
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // 原生 PTY。
    //
    // Java 层的 ProcessBuilder 只能用管道，管道不是终端，bash 会立刻
    // EOF 退出，交互式会话根本起不来。这里编一个很小的 libbfpty.so
    // （forkpty + execve + waitpid + TIOCSWINSZ），见 src/main/cpp/pty.c。
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    ndkVersion '26.1.10909125'
    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        // Kotlin 1.9.22 对应的 Compose Compiler
        kotlinCompilerExtensionVersion '1.5.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    // 单元测试：连接层纯逻辑（任务书第六节）
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // ---------------- Jetpack Compose ----------------
    // BOM 统一 Compose 各库版本，避免手工对版本
    implementation platform('androidx.compose:compose-bom:2024.02.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}