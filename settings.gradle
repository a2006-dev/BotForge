pluginManagement {
    repositories {
        // mavenCentral 优先：gradlePluginPortal 在 CI 上常被限流（429 Too Many Requests）
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "BotForge"
include ':app'